[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rigorlight"
version = "0.0.1"
description = "Traffic-light screening of scientific papers for rigor"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "anthropic>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
